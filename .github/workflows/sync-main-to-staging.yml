name: Sync main to staging

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sync-main-to-staging
  cancel-in-progress: false

jobs:
  sync:
    name: Sync code to staging
    runs-on: ubuntu-latest
    environment: Staging

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure trusted staging synchronization SSH
        env:
          STAGING_SYNC_SSH_KEY: ${{ secrets.STAGING_SYNC_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$STAGING_SYNC_SSH_KEY" ]] || {
            echo "::error::STAGING_SYNC_SSH_KEY is not configured in the Staging environment."
            exit 1
          }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$STAGING_SYNC_SSH_KEY" > "$HOME/.ssh/pensive-staging-sync"
          chmod 600 "$HOME/.ssh/pensive-staging-sync"
          ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/pensive-staging-sync -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Check staging alignment
        id: guard
        env:
          BEFORE_SHA: ${{ github.event.before }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$BEFORE_SHA" =~ ^0{40}$ ]]; then
            echo "::error::Cannot determine the previous main commit. Staging was not changed."
            exit 1
          fi

          git fetch --no-tags origin main staging

          staging_sha="$(git rev-parse origin/staging)"
          staging_tree="$(git rev-parse origin/staging^{tree})"
          before_tree="$(git rev-parse "${BEFORE_SHA}^{tree}")"
          main_tree="$(git rev-parse "${MAIN_SHA}^{tree}")"

          if [[ "$staging_tree" == "$main_tree" ]]; then
            echo "Staging already has the exact main code."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$staging_tree" != "$before_tree" ]]; then
            echo "::error::Staging contains code that was not present on main before this change."
            echo "::error::Refusing to overwrite staging. Reconcile staging manually first."
            exit 1
          fi

          echo "Staging matched the previous main code; it is safe to advance staging."
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "staging_sha=$staging_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"

      - name: Advance staging to match main
        if: steps.guard.outputs.updated == 'true'
        env:
          EXPECTED_STAGING_SHA: ${{ steps.guard.outputs.staging_sha }}
          MAIN_SHA: ${{ steps.guard.outputs.main_sha }}
        run: |
          set -euo pipefail
          git push \
            --force-with-lease="refs/heads/staging:${EXPECTED_STAGING_SHA}" \
            origin \
            "${MAIN_SHA}:refs/heads/staging"
