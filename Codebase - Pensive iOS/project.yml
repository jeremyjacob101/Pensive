name: Pensive
options:
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Staging: release
  Release: release

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.pensive.app
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: UZ7YLA6V9D
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    SUPPORTS_MACCATALYST: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0

configFiles:
  Debug: Config/Debug.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Release.xcconfig

targets:
  Pensive:
    type: application
    platform: iOS
    sources:
      - path: Pensive
    settings:
      base:
        PRODUCT_NAME: Pensive
        PRODUCT_MODULE_NAME: Pensive
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_FILE: Pensive/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts: []
    dependencies: []

  PensiveUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PensiveUnitTests
    settings:
      base:
        PRODUCT_NAME: PensiveUnitTests
        PRODUCT_MODULE_NAME: PensiveUnitTests
    dependencies:
      - target: Pensive

  PensiveIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PensiveIntegrationTests
    settings:
      base:
        PRODUCT_NAME: PensiveIntegrationTests
        PRODUCT_MODULE_NAME: PensiveIntegrationTests
    dependencies:
      - target: Pensive

  PensiveE2ETests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PensiveE2ETests
    settings:
      base:
        PRODUCT_NAME: PensiveE2ETests
        PRODUCT_MODULE_NAME: PensiveE2ETests
    dependencies:
      - target: Pensive

schemes:
  Pensive:
    build:
      targets:
        Pensive: all
        PensiveUnitTests: [test]
        PensiveIntegrationTests: [test]
        PensiveE2ETests: [test]
    test:
      config: Debug
      targets:
        - name: PensiveUnitTests
        - name: PensiveIntegrationTests
        - name: PensiveE2ETests
    run:
      config: Debug
    archive:
      config: Release
