name: Verify and Deploy Convex

on:
  pull_request:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: convex-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run static quality gates
        run: npm run test:static

      - name: Run web and Convex behavior tests
        run: npm test
