name: Test Suite

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - staging
  workflow_call:
    inputs:
      checkout_ref:
        description: "Optional exact ref to test when called by another workflow"
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify_staging_update:
    name: Classify staging alignment
    runs-on: ubuntu-latest

    outputs:
      trusted_main_alignment: ${{ steps.classify.outputs.trusted_main_alignment }}

    steps:
      - name: Check out staging history for push alignment
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify exact main alignment
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          trusted_main_alignment=false

          if [[ "$EVENT_NAME" == "push" && "$REF" == "refs/heads/staging" ]]; then
            git fetch --no-tags origin main
            main_sha="$(git rev-parse origin/main)"
            if [[ "$SHA" == "$main_sha" ]]; then
              trusted_main_alignment=true
              echo "Staging is aligning to the already-tested main SHA ${SHA}; the full suite will not rerun."
            fi
          fi

          echo "trusted_main_alignment=$trusted_main_alignment" >> "$GITHUB_OUTPUT"

  static-quality:
    name: Static quality
    needs: classify_staging_update
    if: needs.classify_staging_update.outputs.trusted_main_alignment != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run formatting, lint, typecheck, and build gates
        run: npm run test:static

  behavior-tests:
    name: Web and Convex behavior tests
    needs: classify_staging_update
    if: needs.classify_staging_update.outputs.trusted_main_alignment != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run deterministic behavior tests
        run: npm test

      - name: Generate informational coverage report
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pensive-web-convex-coverage-${{ github.run_id }}
          path: test-results/coverage
          if-no-files-found: warn
          retention-days: 14

  browser-e2e:
    name: Browser E2E (non-production)
    needs: classify_staging_update
    if: needs.classify_staging_update.outputs.trusted_main_alignment != 'true'
    runs-on: ubuntu-latest
    environment: Testing

    env:
      PENSIVE_E2E_BASE_URL: http://127.0.0.1:1111
      PENSIVE_E2E_API_URL: ${{ vars.PENSIVE_E2E_API_URL }}
      PENSIVE_E2E_CONVEX_URL: ${{ vars.PENSIVE_E2E_CONVEX_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Require disposable non-production targets
        run: |
          set -euo pipefail
          [[ -n "$PENSIVE_E2E_API_URL" ]] || { echo "PENSIVE_E2E_API_URL is not configured in the Testing environment."; exit 1; }
          [[ -n "$PENSIVE_E2E_CONVEX_URL" ]] || { echo "PENSIVE_E2E_CONVEX_URL is not configured in the Testing environment."; exit 1; }
          if printf '%s\n' "$PENSIVE_E2E_API_URL $PENSIVE_E2E_CONVEX_URL" | grep -Eiq 'frugal-mosquito-712|production|(^|[^a-z])prod([^a-z]|$)'; then
            echo "Production-looking E2E target rejected." >&2
            exit 1
          fi

      - name: Install Chromium, WebKit, and system dependencies
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser, accessibility, responsive, and HTTP contract tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pensive-playwright-${{ github.run_id }}
          path: test-results/playwright
          if-no-files-found: warn
          retention-days: 14

  ios-tests:
    name: iOS unit, integration, and UI tests
    needs: classify_staging_update
    if: needs.classify_staging_update.outputs.trusted_main_alignment != 'true'
    runs-on: macos-15
    environment: Testing

    env:
      DEVICE: iPhone 16 Pro
      PENSIVE_RESET_SIMULATOR: "1"
      PENSIVE_IOS_TEST_HTTP_URL: ${{ vars.PENSIVE_IOS_TEST_HTTP_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Install xcodegen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Reject production live-test target
        run: |
          set -euo pipefail
          if [[ -n "${PENSIVE_IOS_TEST_HTTP_URL:-}" ]]; then
            if printf '%s\n' "$PENSIVE_IOS_TEST_HTTP_URL" | grep -Eiq 'frugal-mosquito-712|production|(^|[^a-z])prod([^a-z]|$)'; then
              echo "Production-looking iOS test target rejected." >&2
              exit 1
            fi
          fi

      - name: Run the complete iOS test flow
        run: ./scripts/test-ios-stable.sh

  deploy-staging:
    name: Deploy staging
    if: >-
      always() &&
      github.ref == 'refs/heads/staging' &&
      (
        (
          github.event_name == 'push' &&
          needs.classify_staging_update.outputs.trusted_main_alignment == 'true'
        ) ||
        (
          needs.classify_staging_update.outputs.trusted_main_alignment != 'true' &&
          needs['static-quality'].result == 'success' &&
          needs['behavior-tests'].result == 'success' &&
          needs['browser-e2e'].result == 'success' &&
          needs['ios-tests'].result == 'success'
        )
      )
    needs:
      - classify_staging_update
      - static-quality
      - behavior-tests
      - browser-e2e
      - ios-tests
    runs-on: ubuntu-latest
    environment: Staging
    concurrency:
      group: convex-staging-deployment
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Deploy Convex staging after tests or trusted main alignment
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --message "Deploy $GITHUB_SHA to staging"
